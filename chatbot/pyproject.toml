[tool.poetry]
name = "chatbot"
version = "0.1.0"
description = "RAG-based chatbot for TuneScript"
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
torch = { version = "^2.0.1", source = "torch-cpu" }
transformers = "^4.31.0"
sentence-transformers = "^2.2.2"
flask = "^2.0.0"
faiss-cpu = "1.7.4"
numpy = "1.24.3"
rank_bm25 = "^0.2.2"
scikit-learn = "^1.2.2"
accelerate = "^0.21.0"  # Add this line


[[tool.poetry.source]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"